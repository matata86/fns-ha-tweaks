fns_mushroom:
  # ==========================================================================
  # FNS Mushroom — modernizace 2026-09-02
  # Základ: vlastní akcentová modř (indigo) místo HA cyan, dva odstíny
  # povrchů (stránka / karta / sidebar), hairline okraje karet, měkké
  # vrstvené stíny, glass hlavička a dialogy, ambientní záře pozadí,
  # squircle ikony (12px) u tile i mushroom, silnější typografie.
  # Barvy v modes: dole. Načítá se přes frontend.reload_themes.
  # ==========================================================================

  # --- Typografie -----------------------------------------------------------
  ha-font-family-body: 'Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif'
  ha-font-family-heading: "var(--ha-font-family-body)"
  ha-font-weight-heading: 700
  ha-font-weight-action: 600

  # --- Akcent (indigo) — škála přebíjí HA primary tokeny, takže ji
  #     převezmou i nové komponenty (switch, tlačítka, chipy, odkazy) ------
  ha-color-primary-05: "#070d24"
  ha-color-primary-10: "#0d1740"
  ha-color-primary-20: "#14245f"
  ha-color-primary-30: "#1d3a9a"
  ha-color-primary-40: "#2b55d6"
  ha-color-primary-50: "#3f6df5"
  ha-color-primary-60: "#6b8cff"
  ha-color-primary-70: "#93aaff"
  ha-color-primary-80: "#bcc9ff"
  ha-color-primary-90: "#dfe6ff"
  ha-color-primary-95: "#eff2ff"
  accent-color: "#ff8a4c"
  rgb-accent-color: "255, 138, 76"
  text-primary-color: "#ffffff"
  theme-amber: "var(--amber-color)"

  # --- Barevná sada (nahrazuje Material 2014 defaulty HA) -------------------
  # 2026-09-06: hodnoty jsou v modes: light / dark jako --fns-*. Tady zůstávají jen aliasy,
  # aby existující tokeny HA i mushroom braly barvu z jednoho místa.
  red-color: "var(--fns-red)"
  pink-color: "var(--fns-pink)"
  purple-color: "var(--fns-purple)"
  deep-purple-color: "var(--fns-deep-purple)"
  indigo-color: "var(--fns-indigo)"
  blue-color: "var(--fns-blue)"
  light-blue-color: "var(--fns-light-blue)"
  cyan-color: "var(--fns-cyan)"
  teal-color: "var(--fns-teal)"
  green-color: "var(--fns-green)"
  light-green-color: "var(--fns-light-green)"
  lime-color: "var(--fns-lime)"
  yellow-color: "var(--fns-yellow)"
  amber-color: "var(--fns-amber)"
  orange-color: "var(--fns-orange)"
  deep-orange-color: "var(--fns-deep-orange)"
  brown-color: "var(--fns-brown)"
  grey-color: "var(--fns-grey)"
  light-grey-color: "var(--fns-light-grey)"
  dark-grey-color: "var(--fns-dark-grey)"
  blue-grey-color: "var(--fns-blue-grey)"
  error-color: "var(--fns-danger)"
  warning-color: "var(--fns-warning)"
  success-color: "var(--fns-success)"
  info-color: "var(--fns-info)"
  rgb-red: "var(--fns-rgb-red)"
  rgb-pink: "var(--fns-rgb-pink)"
  rgb-purple: "var(--fns-rgb-purple)"
  rgb-deep-purple: "var(--fns-rgb-deep-purple)"
  rgb-indigo: "var(--fns-rgb-indigo)"
  rgb-blue: "var(--fns-rgb-blue)"
  rgb-light-blue: "var(--fns-rgb-light-blue)"
  rgb-cyan: "var(--fns-rgb-cyan)"
  rgb-teal: "var(--fns-rgb-teal)"
  rgb-green: "var(--fns-rgb-green)"
  rgb-light-green: "var(--fns-rgb-light-green)"
  rgb-lime: "var(--fns-rgb-lime)"
  rgb-yellow: "var(--fns-rgb-yellow)"
  rgb-amber: "var(--fns-rgb-amber)"
  rgb-orange: "var(--fns-rgb-orange)"
  rgb-deep-orange: "var(--fns-rgb-deep-orange)"
  rgb-brown: "var(--fns-rgb-brown)"
  rgb-grey: "var(--fns-rgb-grey)"
  rgb-error-color: "var(--fns-rgb-danger)"
  rgb-warning-color: "var(--fns-rgb-warning)"
  rgb-success-color: "var(--fns-rgb-success)"
  rgb-info-color: "var(--fns-rgb-info)"

  # --- State barvy (formát state-<domain>-<stav>-color) ---------------------
  state-alarm_control_panel-disarmed-color: "var(--green-color)"
  state-alarm_control_panel-armed_away-color: "var(--red-color)"
  state-alarm_control_panel-arming-color: "var(--orange-color)"
  state-alarm_control_panel-pending-color: "var(--orange-color)"
  state-alarm_control_panel-triggered-color: "var(--red-color)"
  state-climate-auto-color: "var(--green-color)"
  state-climate-cool-color: "var(--blue-color)"
  state-climate-dry-color: "var(--orange-color)"
  state-climate-fan_only-color: "var(--blue-color)"
  state-climate-heat-color: "var(--orange-color)"
  state-climate-heat_cool-color: "var(--yellow-color)"
  state-climate-idle-color: "var(--grey-color)"
  state-fan-active-color: "var(--state-active-color)"
  state-lock-jammed-color: "var(--red-color)"
  state-lock-locked-color: "var(--red-color)"
  state-lock-unlocked-color: "var(--green-color)"
  state-media_player-active-color: "var(--state-active-color)"
  state-media_player-on-color: "var(--state-active-color)"
  state-media_player-idle-color: "var(--primary-color)"
  state-person-home-color: "var(--green-color)"
  state-sensor-battery-high-color: "var(--green-color)"
  state-sensor-battery-low-color: "var(--red-color)"
  state-sensor-battery-medium-color: "var(--orange-color)"
  state-update-installing-color: "var(--orange-color)"
  state-vacuum-active-color: "var(--state-active-color)"

  # --- Mushroom -------------------------------------------------------------
  # Aliasy na --fns-rgb-* — jeden zdroj pravdy pro HA i mushroom
  mush-rgb-blue: "var(--fns-rgb-blue)"
  mush-rgb-red: "var(--fns-rgb-red)"
  mush-rgb-orange: "var(--fns-rgb-orange)"
  mush-rgb-yellow: "var(--fns-rgb-yellow)"
  mush-rgb-gray: "var(--fns-rgb-grey)"
  mush-rgb-grey: "var(--fns-rgb-grey)"
  mush-rgb-green: "var(--fns-rgb-green)"
  mush-rgb-amber: "var(--fns-rgb-amber)"
  mush-rgb-teal: "var(--fns-rgb-teal)"
  mush-rgb-cyan: "var(--fns-rgb-cyan)"
  mush-rgb-purple: "var(--fns-rgb-purple)"
  mush-rgb-pink: "var(--fns-rgb-pink)"
  mush-rgb-deep-orange: "var(--fns-rgb-deep-orange)"
  mush-rgb-light-blue: "var(--fns-rgb-light-blue)"
  mush-rgb-indigo: "var(--fns-rgb-indigo)"
  # mush-rgb-state = akcent, definován v modes (světlý/tmavý odstín)
  mush-spacing: 12px
  mush-icon-size: 40px
  mush-icon-border-radius: 12px
  mush-control-border-radius: 12px
  mush-card-primary-font-weight: 600
  mush-card-primary-letter-spacing: "-0.1px"
  mush-card-secondary-font-size: 12px
  mush-title-font-weight: 700
  mush-title-letter-spacing: "-0.4px"

  # --- Karty ----------------------------------------------------------------
  ha-card-border-radius: 16px
  # Okraj karty je 0 — vnitřní karty ve stack-in-card by jinak měly každá
  # svůj rámeček (dvojité linky). Hairline dělá první vrstva box-shadow
  # (0 0 0 1px), kterou stack-in-card i třída no-shadow u vnitřních karet zruší.
  ha-card-border-width: 0px
  ha-card-box-shadow: "var(--box-shadow)"
  ha-card-features-border-radius: 12px

  # Tile (nativní) — squircle ikona, výraznější primární text
  ha-tile-icon-border-radius: 12px
  ha-tile-info-primary-font-weight: 600
  ha-tile-info-primary-letter-spacing: "-0.1px"

  # Heading karta — titulek těžší, podtitulek jako malý štítek (uppercase v CSS níže)
  ha-heading-card-title-font-size: 18px
  ha-heading-card-title-font-weight: 700
  ha-heading-card-subtitle-font-size: 11px
  ha-heading-card-subtitle-font-weight: 600

  # --- Hlavička (glass) a sidebar --------------------------------------------
  app-header-background-color: "var(--fns-header-bg)"
  app-header-text-color: "var(--primary-text-color)"
  app-header-backdrop-filter: "blur(18px) saturate(160%)"
  app-header-selection-bar-color: "var(--primary-color)"
  bar-box-shadow: "0 1px 0 var(--divider-color)"
  sidebar-background-color: "var(--fns-sidebar-bg)"
  sidebar-text-color: "var(--primary-text-color)"
  sidebar-icon-color: "var(--secondary-text-color)"
  sidebar-selected-text-color: "var(--primary-color)"
  sidebar-selected-icon-color: "var(--primary-color)"

  # --- Dialogy / popupy (glass) ------------------------------------------------
  ha-dialog-border-radius: 24px
  ha-dialog-surface-background: "var(--card-background-color)"
  ha-dialog-scrim-backdrop-filter: "blur(10px)"
  mdc-dialog-scrim-color: "var(--fns-scrim)"

  # browser_mod popup se size: wide dává obsahu šířku --popup-wide-width
  # (default 90vw), zatímco plocha dialogu je na mobilu přes celou obrazovku.
  # Obsah není vycentrovaný, takže těch chybějících 10 % zbyde jako prázdno
  # vpravo. 100% = obsah vyplní plochu dialogu, symetricky na mobilu i desktopu.
  popup-wide-width: "100%"

  # Pozadí view = statická denní záře (fns-ambient per mód) hned při načtení; uix-root-yaml ji pak
  # přepíše cirkadiánní/počasím (stejné rozměry a polohy, takže nic neblikne). Dřív transparent → bílý záblesk.
  lovelace-background: "var(--fns-ambient)"

  uix-theme: "fns_mushroom"

  # --- ROOT (hui-root: hlavička + kontejner view) ---------------------------
  # 2026-09-05 (6): odstín záře jde s cirkadiánem — sensor.light_color 140 mired (den) = indigo + teal,
  # 650 (noc) = jantar + oranžová; mezi tím lineárně. Průhlednost per mód přes fns-ambient-a1/a2.
  # 2026-09-05 (počasí 1+2): stav weather.openweathermap barvu přimíchá (zataženo šedomodrá, déšť chladná,
  # sníh bledá, mlha šedý závoj) a násobí alfu. Slunce = vlastní třetí teplá záře (oranžová nízko, žlutá vysoko),
  # která putuje po horním okraji podle azimuth/elevation, slábne se zataženem (1 - váha počasí) a pod obzorem
  # (-6°) zhasne; obě základní záře zůstávají v rozích (první pokus s posunem základní záře nebyl vidět).
  uix-root-yaml: |
    .: |
      {# test denní doby (2026-09-05): input_boolean.denni_doba_test_zapnuto + input_number.denni_doba_test (0–24 h)
         simuluje slunce (azimut 60° v 6 h → 300° v 18 h, výška 60·sin) i cirkadián (den 7:30–17:30, noc 21:30–4:00). #}
      {% set test = is_state('input_boolean.denni_doba_test_zapnuto', 'on') %}
      {% set th = states('input_number.denni_doba_test') | float(12) %}
      {# 2026-09-06: stejný soubor běží na Home i Office — entita počasí se hledá, cirkadián má náhradu z výšky slunce #}
      {% set went = 'weather.openweathermap' if has_value('weather.openweathermap') else (states.weather | map(attribute='entity_id') | list | first | default('')) %}
      {% set m = states('sensor.light_color') | float(0) %}
      {% if m <= 0 %}{% set el0 = state_attr('sun.sun', 'elevation') | float(0) %}{% set m = 140 + 510 * [[(6 - el0) / 12, 0] | max, 1] | min %}{% endif %}
      {% set k = (([[(m - 140) / 510, 0] | max, 1] | min) * 20) | round(0) / 20 %}
      {% if test %}
        {% set k = 0 if 7.5 <= th <= 17.5 else (1 if th >= 21.5 or th < 4 else ((th - 17.5) / 4 if th > 17.5 else 1 - (th - 4) / 3.5)) %}
      {% endif %}
      {% set b1 = [63 + 182 * k, 109 + 49 * k, 245 - 182 * k] %}
      {% set b2 = [20 + 229 * k, 184 - 69 * k, 166 - 144 * k] %}
      {% set w = states(went) if went else 'unknown' %}
      {% set W = {
        'partlycloudy':    [[130, 140, 165], 0.25, 0.95],
        'cloudy':          [[118, 132, 158], 0.55, 0.90],
        'rainy':           [[58, 118, 168], 0.60, 1.00],
        'pouring':         [[48, 100, 150], 0.75, 1.10],
        'snowy':           [[188, 206, 232], 0.65, 1.15],
        'snowy-rainy':     [[140, 170, 205], 0.60, 1.00],
        'hail':            [[110, 130, 160], 0.60, 1.00],
        'fog':             [[150, 156, 168], 0.70, 1.25],
        'lightning':       [[120, 108, 190], 0.55, 1.10],
        'lightning-rainy': [[90, 100, 170], 0.60, 1.10],
        'windy':           [[120, 150, 170], 0.30, 0.95],
        'windy-variant':   [[120, 140, 165], 0.35, 0.95],
        'exceptional':     [[200, 120, 90], 0.40, 1.00] } %}
      {% set wc, wg, wa = W.get(w, [[0, 0, 0], 0, 1]) %}
      {% set c1 = (b1[0] * (1 - wg) + wc[0] * wg) | round(0) | int ~ ', ' ~ (b1[1] * (1 - wg) + wc[1] * wg) | round(0) | int ~ ', ' ~ (b1[2] * (1 - wg) + wc[2] * wg) | round(0) | int %}
      {% set c2 = (b2[0] * (1 - wg) + wc[0] * wg) | round(0) | int ~ ', ' ~ (b2[1] * (1 - wg) + wc[1] * wg) | round(0) | int ~ ', ' ~ (b2[2] * (1 - wg) + wc[2] * wg) | round(0) | int %}
      {% set el = state_attr('sun.sun', 'elevation') | float(-10) %}
      {% set az = state_attr('sun.sun', 'azimuth') | float(180) %}
      {% if test %}{% set az = (60 + (th - 6) / 12 * 240) % 360 %}{% set el = 60 * sin(pi * (th - 6) / 12) %}{% endif %}
      {% set sx = [[(az - 60) / 240 * 90 + 5, 3] | max, 97] | min | round(0) | int %}
      {% set sy = [[14 - el * 0.3, -4] | max, 14] | min | round(0) | int %}
      {% set hi = [[el / 45, 0] | max, 1] | min %}
      {% set sun = (255) ~ ', ' ~ ((150 + 70 * hi) / 10) | round(0) | int * 10 ~ ', ' ~ ((60 + 100 * hi) / 10) | round(0) | int * 10 %}
      {% set sa = ((1 - wg) * (1 if el > 0 else [1 + el / 6, 0] | max)) | round(1) %}
      {# advent (2026-09-06): po soumraku teplý svíčkový nádech zdola, sytost roste s počtem zapálených svíček.
         Mimo advent (a na instanci bez binary_sensor.advent) se nepřidá nic. #}
      {% set svicky = state_attr('binary_sensor.advent', 'svicky') | int(0) if is_state('binary_sensor.advent', 'on') else 0 %}
      {% set adv = ((0.5 + 0.22 * svicky) * ([[(2 - el) / 8, 0] | max, 1] | min)) | round(2) if svicky > 0 else 0 %}
      #view {
        background:
          {% if adv > 0.05 %}radial-gradient(1000px 520px at 50% 112%, rgba(255, 186, 112, calc(var(--fns-ambient-a1) * {{ adv }})), transparent 64%),{% endif %}
          {% if sa > 0.02 %}radial-gradient(700px 480px at {{ sx }}% {{ sy }}%, rgba({{ sun }}, calc(var(--fns-ambient-a1) * {{ (sa * 1.7) | round(2) }})), transparent 65%),{% endif %}
          radial-gradient(1100px 640px at 6% -6%, rgba({{ c1 }}, calc(var(--fns-ambient-a1) * {{ wa }})), transparent 62%),
          radial-gradient(900px 560px at 100% 8%, rgba({{ c2 }}, calc(var(--fns-ambient-a2) * {{ wa }})), transparent 60%),
          var(--primary-background-color) !important;
        transition: background 2s ease;
      }
      {# ---- vrstvy počasí (2026-09-05 v2): částice = box-shadow na ::before/::after, pohyb jen transform (GPU).
         Částice generuje pudorys_build sourozenec `pocasi_vrstvy.py` (seed 7, pole 2200×1300 px zdvojené v y pro plynulou smyčku).
         Vrstva je pod kartami: #view isolate + z-index -1. Přepínač input_select.pocasi_vrstva, Auto = podle weather. #}
      {% set sel = states('input_select.pocasi_vrstva') %}
      {% set auto = {'rainy': 'rain', 'pouring': 'pour', 'snowy': 'snow', 'snowy-rainy': 'snow', 'hail': 'pour', 'fog': 'fog', 'lightning': 'storm', 'lightning-rainy': 'storm', 'sunny': 'sun', 'partlycloudy': 'clouds', 'windy': 'clouds', 'windy-variant': 'clouds', 'cloudy': 'overcast', 'clear-night': 'stars'} %}
      {% set layer = {'Déšť': 'rain', 'Liják': 'pour', 'Sníh': 'snow', 'Mlha': 'fog', 'Bouřka': 'storm', 'Jasno': 'sun', 'Polojasno': 'clouds', 'Zataženo': 'overcast', 'Jasná noc': 'stars', 'Žádná': 'none'}.get(sel, auto.get(w, 'none')) %}
      {# (5) předpověď: když do 2 h přijde déšť/sníh a teď nic nepadá, začne slabá vrstva dřív (jen v Auto) #}
      {% set faint = false %}
      {% set pre = states('sensor.pocasi_predpoved_2h') %}
      {% if sel == 'Auto' and layer in ['none', 'sun', 'clouds', 'overcast', 'stars'] and pre in ['rainy', 'pouring', 'lightning-rainy', 'hail', 'snowy', 'snowy-rainy'] %}
        {% set layer = 'snow' if pre in ['snowy', 'snowy-rainy'] else 'rain' %}{% set faint = true %}
      {% endif %}
      {% set ws = state_attr(went, 'wind_speed') | float(0) if went else 0 %}
      {% set wb = state_attr(went, 'wind_bearing') | float(0) if went else 0 %}
      {% set sg = 1 if wb < 180 else -1 %}
      {% set tilt = (([ws / 50 * 14, 14] | min) * sg) | round(0) | int %}
      {# vrstvy jen na Přehledu (+ view Debug s testovacími kartami): UIX předává panel.fullUrlPath; bez proměnné (jiný kontext) nic #}
      {% set na_prehledu = (panel.fullUrlPath | default('') | lower) in ['lovelace', 'lovelace/prehled', 'lovelace/debug'] if panel is defined else false %}
      {% if not na_prehledu %}{% set layer = 'none' %}{% endif %}
      #view { position: relative; isolation: isolate; }
      {% if layer != 'none' %}
      #view::before, #view::after {
        content: ''; position: fixed; left: -15vw; top: -1300px; width: 130vw; height: 2600px;
        z-index: -1; pointer-events: none;
      }
      {% endif %}
      {% if layer in ['rain', 'pour', 'storm'] %}
      {% set heavy = layer != 'rain' %}
      #view::before {
