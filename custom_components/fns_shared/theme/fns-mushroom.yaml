      }
      @keyframes fns-snow-a { 0% { transform: translate3d(0, 0, 0); } 25% { transform: translate3d({{ 18 * sg }}px, 325px, 0); } 50% { transform: translate3d({{ 4 * sg }}px, 650px, 0); } 75% { transform: translate3d({{ 26 * sg }}px, 975px, 0); } 100% { transform: translate3d({{ 40 * sg }}px, 1300px, 0); } }
      @keyframes fns-snow-b { 0% { transform: translate3d(0, 0, 0); } 33% { transform: translate3d({{ -10 * sg }}px, 433px, 0); } 66% { transform: translate3d({{ 14 * sg }}px, 866px, 0); } 100% { transform: translate3d({{ 20 * sg }}px, 1300px, 0); } }
      {% endif %}
      {% if layer == 'fog' %}
      #view::before {
        left: 0; top: 0; width: 100vw; height: 100vh; opacity: .85;
        background-image:
          radial-gradient(70vw 45vh at 20% 30%, rgba(var(--fns-fog-rgb), .36), transparent 70%),
          radial-gradient(60vw 40vh at 75% 60%, rgba(var(--fns-fog-rgb), .30), transparent 70%),
          radial-gradient(50vw 35vh at 50% 90%, rgba(var(--fns-fog-rgb), .20), transparent 70%);
        background-size: 200% 100%;
        animation: fns-fog-a 70s ease-in-out infinite alternate;
      }
      #view::after {
        left: 0; top: 0; width: 100vw; height: 100vh; opacity: .7;
        background-image:
          radial-gradient(65vw 40vh at 80% 20%, rgba(var(--fns-fog-rgb), .22), transparent 70%),
          radial-gradient(55vw 38vh at 30% 75%, rgba(var(--fns-fog-rgb), .20), transparent 70%),
          linear-gradient(rgba(var(--fns-fog-rgb), .10), rgba(var(--fns-fog-rgb), .10));
        background-size: 200% 100%, 200% 100%, 100% 100%;
        animation: fns-fog-b 95s ease-in-out infinite alternate;
      }
      @keyframes fns-fog-a { from { background-position: 0% 0; } to { background-position: 100% 0; } }
      @keyframes fns-fog-b { from { background-position: 100% 0, 100% 0, 0 0; } to { background-position: 0% 0, 0% 0, 0 0; } }
      {% endif %}
      {% set wind = 1 + ([ws, 60] | min) / 30 %}
      {# oblaky (polojasno) jen za světla — v noci v tmavém módu vypadaly jako šedý flek (uživatel 2026-09-05) #}
      {% if layer == 'clouds' and el < -6 %}{% set layer = 'none' %}{% endif %}
      {% if layer == 'sun' and sa > 0.15 %}
      {# paprsky: kuželový gradient kolem slunce, pomalá rotace kolem jeho polohy, maska do ztracena #}
      #view::before {
        left: 0; top: 0; width: 100vw; height: 100vh; opacity: {{ (sa * 0.9) | round(2) }};
        background: repeating-conic-gradient(from 0deg at {{ sx }}% {{ sy }}%, rgba({{ sun }}, .10) 0deg 3deg, transparent 3deg 11deg, rgba({{ sun }}, .05) 11deg 13deg, transparent 13deg 24deg);
        -webkit-mask-image: radial-gradient(circle at {{ sx }}% {{ sy }}%, black 0%, transparent 42%);
        mask-image: radial-gradient(circle at {{ sx }}% {{ sy }}%, black 0%, transparent 42%);
        transform-origin: {{ sx }}% {{ sy }}%;
        animation: fns-rays 160s linear infinite;
      }
      @keyframes fns-rays { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      {% endif %}
      {% if layer == 'clouds' %}
      {# polojasno: měkké oblaky plující ve směru větru, rychlost podle wind_speed #}
      #view::before {
        left: 0; top: 0; width: 100vw; height: 100vh; opacity: .9;
        background-image:
          radial-gradient(38vw 22vh at 15% 18%, rgba(var(--fns-cloud-rgb), .30), transparent 70%),
          radial-gradient(30vw 18vh at 62% 8%, rgba(var(--fns-cloud-rgb), .26), transparent 70%),
          radial-gradient(34vw 20vh at 88% 34%, rgba(var(--fns-cloud-rgb), .22), transparent 70%);
        background-size: 240% 100%; background-repeat: repeat-x;
        animation: fns-clouds-a {{ (150 / wind) | round(0) | int }}s linear infinite{{ ' reverse' if sg < 0 else '' }};
      }
      #view::after {
        left: 0; top: 0; width: 100vw; height: 100vh; opacity: .7;
        background-image:
          radial-gradient(26vw 14vh at 40% 60%, rgba(var(--fns-cloud-rgb), .20), transparent 70%),
          radial-gradient(22vw 12vh at 80% 78%, rgba(var(--fns-cloud-rgb), .16), transparent 70%);
        background-size: 260% 100%; background-repeat: repeat-x;
        animation: fns-clouds-b {{ (230 / wind) | round(0) | int }}s linear infinite{{ ' reverse' if sg < 0 else '' }};
      }
      @keyframes fns-clouds-a { from { background-position: 0 0; } to { background-position: 240vw 0; } }
      @keyframes fns-clouds-b { from { background-position: 0 0; } to { background-position: 260vw 0; } }
      {% endif %}
      {% if layer == 'overcast' %}
      {# zataženo: šedý závoj + pomalu plující tmavší chuchvalce #}
      #view::before {
        left: 0; top: 0; width: 100vw; height: 100vh; opacity: 1;
        background-image:
          radial-gradient(60vw 30vh at 25% 12%, rgba(var(--fns-overcast-rgb), .22), transparent 70%),
          radial-gradient(50vw 26vh at 70% 30%, rgba(var(--fns-overcast-rgb), .18), transparent 70%),
          radial-gradient(45vw 24vh at 45% 70%, rgba(var(--fns-overcast-rgb), .14), transparent 70%),
          linear-gradient(rgba(var(--fns-overcast-rgb), .12), rgba(var(--fns-overcast-rgb), .12));
        background-size: 250% 100%, 250% 100%, 250% 100%, 100% 100%; background-repeat: repeat-x, repeat-x, repeat-x, no-repeat;
        animation: fns-overcast {{ (260 / wind) | round(0) | int }}s linear infinite{{ ' reverse' if sg < 0 else '' }};
      }
      @keyframes fns-overcast { from { background-position: 0 0, 0 0, 0 0, 0 0; } to { background-position: 250vw 0, 250vw 0, 250vw 0, 0 0; } }
      {% endif %}
      {% if layer == 'stars' %}
      {# jasná noc: dvě sady hvězd (box-shadow), střídavé blikání = mihotání #}
      #view::before, #view::after {
        left: 0; top: 0; width: 1.6px; height: 1.6px; border-radius: 50%; background: transparent;
      }
