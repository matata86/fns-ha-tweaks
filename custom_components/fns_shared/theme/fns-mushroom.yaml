      @keyframes fns-rain-a { from { transform: rotate({{ tilt | round(1) }}deg) translate3d(0, 0, 0); } to { transform: rotate({{ tilt | round(1) }}deg) translate3d(0, 1300px, 0); } }
      @keyframes fns-rain-b { from { transform: rotate({{ (tilt * 0.7) | round(1) }}deg) translate3d(0, 0, 0); } to { transform: rotate({{ (tilt * 0.7) | round(1) }}deg) translate3d(0, 1300px, 0); } }
      {% endif %}
      {% if layer == 'storm' %}
      #view::after {
        left: 0; top: 0; width: 100vw; height: 100vh; box-shadow: none;
        background: rgb(var(--fns-flash-rgb)); opacity: 0; z-index: 2; mix-blend-mode: screen;
        animation: fns-flash 31s linear infinite;
      }
      @keyframes fns-flash { 0%, 62%, 63.6%, 64.9%, 89%, 89.8%, 100% { opacity: 0; } 62.3% { opacity: .55; } 62.9% { opacity: .1; } 64.3% { opacity: .4; } 89.3% { opacity: .35; } }
      {% endif %}
      {% if layer == 'snow' %}
