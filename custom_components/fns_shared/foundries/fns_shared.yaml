uix_foundries:
  level_tile:
    element:
      entity: '{{ entity }}'
      icon: '{{ icon }}'
      icon_color: '{{ color }}'
      layout: vertical
      primary: << states('{{ entity }}') | float(0) | round(0) >> %
      secondary: '{{ name }}'
      tap_action:
        action: more-info
      type: custom:mushroom-template-card
      uix:
        style: "{% set v = states(config.entity) | float(0) | round(0) %}\n/* Progress zdola: plná barva do hodnoty, nad ní ještě 10 px, které přejdou do úplné průhlednosti. */\nha-card {\n  position: relative; overflow: hidden; z-index: 0;\n  background-color: var(--ha-card-background, var(--card-background-color, #fff)) !important;\n}\nha-card::before {\n  content: \"\"; position: absolute; left: 0; right: 0; bottom: 0; z-index: -1;\n  height: calc({{ v }}% + 10px);\n  background: linear-gradient(to top,\n    rgba({{ rgb }}, {{ alfa }}) 0,\n    rgba({{ rgb }}, {{ alfa }}) calc(100% - 10px),\n    rgba({{ rgb }}, 0) 100%);\n  transition: height .6s cubic-bezier(.25, .1, .25, 1);\n  {% if v <= 0 %}display: none;{% endif %}\n}\nha-card .primary { font-size: 14px !important; white-space: nowrap !important; }\nha-card .secondary { font-size: 11px !important; white-space: nowrap !important; overflow: hidden; text-overflow: ellipsis; }\n"
    forge:
      billets:
        alfa: '.22'
        color: grey
        entity: null
        icon: mdi:water
        name: ''
        rgb: 150,150,150
      grid_options:
        columns: 3
        rows: 2
      mold: card
  mini_graph:
    element:
      animate: true
      color_thresholds:
      - color: '{{ c1 }}'
        value: '{{ v1 }}'
      - color: '{{ c2 }}'
        value: '{{ v2 }}'
      - color: '{{ c3 }}'
        value: '{{ v3 }}'
      - color: '{{ c4 }}'
        value: '{{ v4 }}'
      - color: '{{ c5 }}'
        value: '{{ v5 }}'
      color_thresholds_transition: hard
      entities:
      - '{{ entity }}'
      font_size: '{{ font_size }}'
      hour24: true
      hours_to_show: '{{ hours }}'
      name: '{{ name }}'
      points_per_hour: '{{ pph }}'
      show:
        average: true
        extrema: true
        fill: '{{ fill }}'
        icon: '{{ icon }}'
        icon_adaptive_color: true
        labels: false
        legend: '{{ legend }}'
        name: '{{ show_name }}'
        state: '{{ state }}'
      type: custom:mini-graph-card
      uix:
        class: '{{ css_class }}'
        style: '{{ card_style }}'
    forge:
      billets:
        c1: '#3b82f6'
        c2: '#f97316'
        c3: '#ef4444'
        c4: '#ef4444'
        c5: '#ef4444'
        card_style: ''
        css_class: ''
        entity: null
        fill: true
        font_size: 100
        hours: 12
        icon: true
        legend: true
        name: null
        pph: 2
        show_name: true
        state: true
        v1: 45
        v2: 50
        v3: 55
        v4: 55
        v5: 55
      mold: card
  threshold_tile:
    element:
      entity: '{{ entity }}'
      features_position: '{{ features_position }}'
      icon: '{{ icon }}'
      name: '{{ name }}'
      state_content: '{{ state_content }}'
      type: tile
      uix:
        style:
          .: "ha-card {\n  /* 2026-09-06: barva z palety motivu (--fns-rgb-*), ne název z palety HA — 'green' byl CSS keyword #008000 a nesedel s ostatnimi kartami */\n  {% if states(config.entity)|float(0) * sgn > t1 %}\n    --tile-color: rgb(var(--fns-rgb-{{ c_hi }})) !important;\n  {% elif states(config.entity)|float(0) * sgn > t2 %}\n    --tile-color: rgb(var(--fns-rgb-{{ c_mid }})) !important;\n  {% else %}\n    --tile-color: rgb(var(--fns-rgb-{{ c_lo }})) !important;\n  {% endif %}\n}\n"
          ha-tile-container$: "/* Progress od hrany: plná barva do hodnoty, za ní 10 px přechodu do úplné průhlednosti. */\n{% set pct = (states(config.entity)|float(0) - fmin) * 100 / (fmax - fmin) %}\n{% if states(config.entity)|float(0) * sgn > t1 %}{% set c = c_hi %}{% elif states(config.entity)|float(0) * sgn > t2 %}{% set c = c_mid %}{% else %}{% set c = c_lo %}{% endif %}\n.background::before {\n  content: \" \"; position: absolute; bottom: 0; pointer-events: none;\n  {% if pct <= 1 %}display: none;{% endif %}\n  transition: all 1s;\n{% if fill_prop == 'width' %}\n  height: 100%; width: calc({{ pct | round(1) }}% + 10px);\n  background: linear-gradient(90deg,\n    rgba(var(--mush-rgb-{{ c }}), .09) 0,\n    rgba(var(--mush-rgb-{{ c }}), .09) calc(100% - 10px),\n    rgba(var(--mush-rgb-{{ c }}), 0) 100%);\n{% else %}\n  width: 100%; height: calc({{ pct | round(1) }}% + 10px);\n  background: linear-gradient(0deg,\n    rgba(var(--mush-rgb-{{ c }}), .09) 0,\n    rgba(var(--mush-rgb-{{\
            \ c }}), .09) calc(100% - 10px),\n    rgba(var(--mush-rgb-{{ c }}), 0) 100%);\n{% endif %}\n}\n"
          ha-tile-info$: ".secondary::after {\n{% if info_entity %}\n  visibility: visible;\n  content: \" ⸱ {{ states(info_entity) }} {{ info_unit }}\";\n  white-space: nowrap;\n  margin-left: 4px;\n{% else %}\n  content: \"\";\n{% endif %}\n}\n{% if info_entity %}\n.secondary::slotted(*) {\n  width: auto !important;\n  flex: 0 0 auto !important;\n}\n{% endif %}\n"
      vertical: '{{ vertical }}'
    forge:
      billets:
        c_hi: green
        c_lo: red
        c_mid: orange
        entity: null
        features_position: bottom
        fill_prop: width
        fmax: 100
        fmin: 0
        icon: ''
        info_entity: ''
        info_unit: ''
        name: null
        sgn: 1
        state_content: state
        t1: null
        t2: null
        vertical: false
      mold: card
